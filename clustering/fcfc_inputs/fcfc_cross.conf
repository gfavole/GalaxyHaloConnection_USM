#Catalogs: ELG and LRG (placeholders will be replaced by Python)
CATALOG         = [PLACEHOLDER_ELG, PLACEHOLDER_LRG]


#Outputs (overwritten dynamically)
PAIR_COUNT_FILE = [PLACEHOLDER_DD, PLACEHOLDER_DS, PLACEHOLDER_SS]
MULTIPOLE_FILE  = PLACEHOLDER_XIL
CF_OUTPUT_FILE  = PLACEHOLDER_CF


BOX_SIZE        = 2000.0   # set at run time from config.BOXSIZE
CATALOG_LABEL   = [D,S]
CATALOG_TYPE    = [2,2]
ASCII_SKIP      = 0
ASCII_COMMENT   = '#'
ASCII_FORMATTER = "%f %f %f %f %f %f"
POSITION        = [${x}, ${y}, ${z}, ${x}, ${y}, ${z}] 


BINNING_SCHEME  = 1
PAIR_COUNT      = [DD,DS,SS]
CF_ESTIMATOR    = DS / @@ - 1
MULTIPOLE       = [0,2,4]
 
PROJECTED_CF    = F
SEP_BIN_FILE    = PLACEHOLDER_BINS   # set at run time
MU_BIN_NUM      = 120
SQ_DIST_PREC    = -4
OUTPUT_STYLE    = 0
OVERWRITE       = 2
VERBOSE         = F
