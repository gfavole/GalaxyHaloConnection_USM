PAIR_COUNT_FILE = [PLACEHOLDER_DD]
CF_OUTPUT_FILE  = PLACEHOLDER_CF


BOX_SIZE        = 2000.0   # set at run time from config.BOXSIZE
CATALOG_LABEL   = [D]
CATALOG_TYPE    = [2]
ASCII_SKIP      = 0
ASCII_COMMENT   = '#'
ASCII_FORMATTER = "%f %f %f"# %f %f %f %f %f"
POSITION        = [${x}, ${y}, ${z}] #[$1, $2, $3] #z-space correction already included in 3    #+$4/((158.839)*(1./(1.+0.8)))]


BINNING_SCHEME  = 1
PAIR_COUNT      = [DD]
CF_ESTIMATOR    = DD / @@ - 1 
MULTIPOLE       = [0,2,4] 
 
PROJECTED_CF    = F
SEP_BIN_FILE    = PLACEHOLDER_BINS   # set at run time to clustering/fcfc_inputs/logbins.txt
MU_BIN_NUM      = 120
SQ_DIST_PREC    = -4
OUTPUT_STYLE    = 0
OVERWRITE       = 2
VERBOSE         = F

